schema_version: 1

context:
  name: ufolib2
  version: "0.19.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: f0544f3a91de7b017473f4859f5be8767f0fb9b3ce15b6d08c72a24015c7b06b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools <80
  run:
    - attrs >=20.1.0
    - fonttools >=4.0.0
    - fs
    - python >=${{ python_min }}
    - setuptools <80

tests:
  - python:
      imports:
        - ufoLib2
      pip_check: false
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: ufoLib2 is a UFO font processing library.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/fonttools/ufoLib2

extra:
  recipe-maintainers:
    - jan-janssen
