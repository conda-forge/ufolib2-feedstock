schema_version: 1

context:
  name: ufolib2
  version: "0.18.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 7de0efcc361c573f2537ee7ceabdb3bc64b19b61304cfa25e828caa7db8ae1a4

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}
    - setuptools
  run:
    - attrs >=20.1.0
    - fonttools >=4.0.0
    - fs
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - ufoLib2
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: ufoLib2 is a UFO font processing library.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/fonttools/ufoLib2

extra:
  recipe-maintainers:
    - jan-janssen
